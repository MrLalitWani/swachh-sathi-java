services:
  app:
    build: .
    container_name: swachh-sathi-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/swachhsathidb
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=swachhuser
      - SPRING_DATASOURCE_PASSWORD=swachhpass
      - H2_CONSOLE_ENABLED=false
      - JWT_SECRET=SwachhSathiProductionSecretKeyWith256BitsMinimumLength2026!
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: swachh-sathi-db
    environment:
      POSTGRES_DB: swachhsathidb
      POSTGRES_USER: swachhuser
      POSTGRES_PASSWORD: swachhpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swachhuser -d swachhsathidb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
