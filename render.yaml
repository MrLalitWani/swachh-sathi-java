services:
  - type: web
    name: swachh-sathi
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: swachhsathi-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver

databases:
  - name: swachhsathi-db
    plan: free
    databaseName: swachhsathidb
    user: swachhuser
